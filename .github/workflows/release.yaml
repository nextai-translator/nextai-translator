name: Release

on:
  push:
    tags: [ v\d+\.\d+\.\d+ ]

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
      release_upload_url: ${{ steps.create-release.outputs.upload_url }}
      release_body: "${{ steps.tag.outputs.message }}"

    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: get_version
        uses: battila7/get-version-action@v2

      - name: Get tag message
        id: tag
        run: |
          git fetch --depth=1 origin +refs/tags/*:refs/tags/*
          echo "message<<EOF" >> $GITHUB_OUTPUT
          echo "$(git tag -l --format='%(contents)' ${{ steps.get_version.outputs.version }})" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create-release
        uses: ncipollo/release-action@v1
        with:
          draft: true
          name: ${{ steps.get_version.outputs.version }}
          tag: ${{ steps.get_version.outputs.version }}
          body: "${{ steps.tag.outputs.message }}"

  # The desktop app is the Go app of desktop/, built with MyGo
  # (desktop/mygo.json). `mygo build -upload` puts the installers, archives
  # and MyGo's signed update manifests in the draft release, from which
  # installed Go apps update. The same files, signed again with the Tauri
  # updater's key, and the latest.json of the tauri-latest-json job let
  # installed Tauri apps (0.x) update into the Go app: see
  # desktop/scripts/tauri-bridge.mjs.
  #
  # Each `mygo build -upload` merges its SHA256SUMS with the release's, so
  # the two builds run one after the other rather than racing on that file.
  build-desktop:
    needs: create-release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: get_version
        uses: battila7/get-version-action@v2

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install NSIS, for the Windows installers
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Set the version
        working-directory: desktop
        env:
          VERSION: ${{ steps.get_version.outputs.version-without-v }}
        run: |
          jq --arg v "$VERSION" '.version = $v' mygo.json > mygo.json.new
          mv mygo.json.new mygo.json

      - name: Build and upload the Linux and Windows apps
        working-directory: desktop
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform linux/amd64,windows/amd64,windows/arm64 -upload

      # Tauri's updater on Linux writes the file over the AppImage and runs
      # it: the launcher installs the Go app the first time, then starts it.
      - name: Make the files for the Tauri updater
        working-directory: desktop
        env:
          VERSION: ${{ steps.get_version.outputs.version-without-v }}
          # The key the Tauri builds signed updates with, under the names
          # `tauri signer sign` reads.
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          mkdir -p tauri-bridge
          node scripts/tauri-bridge.mjs linux-launcher --version "$VERSION" \
            --install-sh dist/linux-amd64/install.sh \
            --archive "dist/linux-amd64/nextai-translator-$VERSION-linux-amd64.tar.gz" \
            --out "tauri-bridge/nextai-translator-$VERSION-linux-amd64.run"
          cp "dist/windows-amd64/nextai-translator-setup-$VERSION-amd64.exe" tauri-bridge/
          for f in tauri-bridge/*; do
            npx --yes @tauri-apps/cli@2.8.4 signer sign "$f"
            node scripts/tauri-bridge.mjs verify "$f"
          done
          gh release upload "v$VERSION" "tauri-bridge/nextai-translator-$VERSION-linux-amd64.run" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: tauri-bridge-linux-windows
          path: desktop/tauri-bridge/

  build-desktop-macos:
    needs: [create-release, build-desktop]
    permissions:
      contents: write
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: get_version
        uses: battila7/get-version-action@v2

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The Developer ID certificate and the notary credentials the Tauri
      # builds used, in a keychain of this job.
      - name: Import the certificate and the notary credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          xcrun notarytool store-credentials notary --keychain "$keychain" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_PASSWORD"
          echo "NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      # mygo.json is plain JSON: the signing settings of this runner go in
      # here only, so that builds elsewhere stay signed ad hoc.
      - name: Set the version and the signing settings
        working-directory: desktop
        env:
          VERSION: ${{ steps.get_version.outputs.version-without-v }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          jq --arg v "$VERSION" --arg id "$APPLE_SIGNING_IDENTITY" --arg kc "$NOTARY_KEYCHAIN" \
            '.version = $v | .macos.signingIdentity = $id | .macos.notarize = {keychainProfile: "notary", keychain: $kc}' \
            mygo.json > mygo.json.new
          mv mygo.json.new mygo.json

      - name: Build, sign, notarize and upload the macOS app
        working-directory: desktop
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform darwin/universal -upload

      # Tauri's updater on macOS replaces the .app with the one folder of a
      # .tar.gz: MyGo's update archive, which holds the stapled app, is one.
      - name: Sign the macOS archive for the Tauri updater
        working-directory: desktop
        env:
          VERSION: ${{ steps.get_version.outputs.version-without-v }}
          # The key the Tauri builds signed updates with, under the names
          # `tauri signer sign` reads.
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          mkdir -p tauri-bridge
          cp "dist/darwin-universal/nextai-translator-$VERSION-darwin-universal.tar.gz" tauri-bridge/
          f="tauri-bridge/nextai-translator-$VERSION-darwin-universal.tar.gz"
          npx --yes @tauri-apps/cli@2.8.4 signer sign "$f"
          node scripts/tauri-bridge.mjs verify "$f"

      - uses: actions/upload-artifact@v4
        with:
          name: tauri-bridge-macos
          path: desktop/tauri-bridge/

  # The latest.json that installed Tauri apps read
  # (plugins.updater.endpoints of src-tauri/tauri.conf.json), naming the
  # files of the Go app in this release.
  tauri-latest-json:
    needs: [create-release, build-desktop, build-desktop-macos]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: get_version
        uses: battila7/get-version-action@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        with:
          pattern: tauri-bridge-*
          path: tauri-bridge
          merge-multiple: true

      - name: Write and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.version-without-v }}
          NOTES: ${{ needs.create-release.outputs.release_body }}
        run: |
          b=tauri-bridge
          node desktop/scripts/tauri-bridge.mjs latest-json --version "$VERSION" --notes "$NOTES" \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v$VERSION/" \
            --out "$b/latest.json" \
            "darwin-aarch64,darwin-x86_64=$b/nextai-translator-$VERSION-darwin-universal.tar.gz" \
            "windows-x86_64=$b/nextai-translator-setup-$VERSION-amd64.exe" \
            "linux-x86_64=$b/nextai-translator-$VERSION-linux-amd64.run"
          cat "$b/latest.json"
          gh release upload "v$VERSION" "$b/latest.json" --repo "$GITHUB_REPOSITORY" --clobber

  build-clip-extension:
    runs-on: ubuntu-22.04

    permissions:
      contents: write
      packages: write

    needs: create-release

    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: get_version
        uses: battila7/get-version-action@v2

      - name: Build PopClip extension
        run: make build-popclip-extension

      - name: Upload PopClip extension to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.release_upload_url }}
          asset_path: dist/nextai-translator.popclipextz
          asset_name: nextai-translator.popclipextz
          asset_content_type: application/zip

      - name: Build SnipDo extension
        run: make build-snipdo-extension

      - name: Upload SnipDo extension to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.release_upload_url }}
          asset_path: dist/nextai-translator.pbar
          asset_name: nextai-translator.pbar
          asset_content_type: application/zip

  build-browser-extension:
    runs-on: ubuntu-22.04

    permissions:
      contents: write
      packages: write

    needs: create-release

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 8.6.0

      - name: setup node
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Get version
        id: get_version
        uses: battila7/get-version-action@v2

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build browser extension
        run: make build-browser-extension
        env:
          VERSION: "${{ steps.get_version.outputs.version-without-v }}"

      - name: Build userscript
        run: make build-userscript
        env:
          VERSION: "${{ steps.get_version.outputs.version-without-v }}"

      - name: Package plugin and create userscript
        run: |
          mkdir release
          mv dist/browser-extension/*.zip release/
          mv dist/nextai-translator.user.js release/nextai-translator-${{ steps.get_version.outputs.version-without-v }}.user.js

      - name: Upload Chromium extensions to release
        id: upload-chromium-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.release_upload_url }}
          asset_path: release/chromium.zip
          asset_name: nextai-translator-chromium-extension-${{ steps.get_version.outputs.version-without-v }}.zip
          asset_content_type: application/zip

      - name: Upload Firefox extensions to release
        id: upload-firefox-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.release_upload_url }}
          asset_path: release/firefox.zip
          asset_name: nextai-translator-firefox-extension-${{ steps.get_version.outputs.version-without-v }}.xpi
          asset_content_type: application/zip

      - name: Upload userscript to release
        id: upload-userscript-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.release_upload_url }}
          asset_path: release/nextai-translator-${{ steps.get_version.outputs.version-without-v }}.user.js
          asset_name: nextai-translator-${{ steps.get_version.outputs.version-without-v }}.user.js
          asset_content_type: application/javascript

  publish-release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    needs: [create-release, build-desktop, build-desktop-macos, tauri-latest-json, build-clip-extension, build-browser-extension]

    steps:
      - name: publish release
        id: publish-release
        uses: actions/github-script@v6
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.release_id,
              draft: false,
              prerelease: false
            })
